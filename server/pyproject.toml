[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartbrain-server"
version = "0.1.0"
description = "ChartBrain server: natural language -> neutral chart spec (stateless intent layer, D13)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["chartbrain_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
